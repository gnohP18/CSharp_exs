<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>

<body style="background-image: url('/images/bg.jpg'); background-repeat: repeat; background-size: cover;">
    <section class="container">
        <div class="d-flex align-items-center justify-content-center w-100 vh-100">
            <form id="login_Form" class="card card-login p-2 bg-black-10"  style="min-width: 400px;">
                <div class="card-title text-center">
                    <h2 class="text-primary-hover">Login</h2>
                </div>
                <div class="card-body">
    
                    <div class="form-outline mb-3">
                        <label class="form-label" for="username">Username</label>
                        <input type="text" id="username" name="username" class="form-control input-text-hover" />
                        <small id="errorUsername"></small>
                    </div>
    
                    <div class="form-outline mb-3">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" id="password" name="password" class="form-control" />
                    </div>
                </div>
                <div class="card-footer d-flex justify-content-center">
                    <button class="btn btn-outline-primary" type="submit">Login</button>
                    <button id="reLogin" class="btn btn-outline-primary">Re-Login</button>
                </div>
            </form>
        </div>
    </section>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="api.js"></script>
    <script src="index.js"></script>
</body>

</html>
